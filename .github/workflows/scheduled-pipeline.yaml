name: Issue Pipeline - Ingest, Score & Digest

on:
  schedule:
    # Daily ingestion + scoring at 2 AM UTC
    - cron: "0 2 * * *"

    # Weekly digest on Monday at 9 AM UTC
    - cron: "0 9 * * 1"

  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ingest-only
          - score-only
          - digest-daily
          - digest-weekly


jobs:

  # ============================================================
  # DETERMINE WHAT TO RUN
  # ============================================================

  schedule-check:
    name: Determine which tasks to run
    runs-on: ubuntu-latest

    outputs:
      run-ingest: ${{ steps.check.outputs.run-ingest }}
      run-score: ${{ steps.check.outputs.run-score }}
      run-digest: ${{ steps.check.outputs.run-digest }}
      digest-freq: ${{ steps.check.outputs.digest-freq }}

    steps:
      - name: Check schedule and inputs
        id: check
        run: |
          # If manually triggered, use the input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"

            case "$MODE" in

              all)
                echo "run-ingest=true" >> "$GITHUB_OUTPUT"
                echo "run-score=true" >> "$GITHUB_OUTPUT"
                echo "run-digest=true" >> "$GITHUB_OUTPUT"
                echo "digest-freq=both" >> "$GITHUB_OUTPUT"
                ;;

              ingest-only)
                echo "run-ingest=true" >> "$GITHUB_OUTPUT"
                echo "run-score=false" >> "$GITHUB_OUTPUT"
                echo "run-digest=false" >> "$GITHUB_OUTPUT"
                echo "digest-freq=none" >> "$GITHUB_OUTPUT"
                ;;

              score-only)
                echo "run-ingest=false" >> "$GITHUB_OUTPUT"
                echo "run-score=true" >> "$GITHUB_OUTPUT"
                echo "run-digest=false" >> "$GITHUB_OUTPUT"
                echo "digest-freq=none" >> "$GITHUB_OUTPUT"
                ;;

              digest-daily)
                echo "run-ingest=false" >> "$GITHUB_OUTPUT"
                echo "run-score=false" >> "$GITHUB_OUTPUT"
                echo "run-digest=true" >> "$GITHUB_OUTPUT"
                echo "digest-freq=daily" >> "$GITHUB_OUTPUT"
                ;;

              digest-weekly)
                echo "run-ingest=false" >> "$GITHUB_OUTPUT"
                echo "run-score=false" >> "$GITHUB_OUTPUT"
                echo "run-digest=true" >> "$GITHUB_OUTPUT"
                echo "digest-freq=weekly" >> "$GITHUB_OUTPUT"
                ;;

            esac

          else
            # Automatic schedule:
            # determine tasks based on github.event.schedule

            SCHEDULE="${{ github.event.schedule }}"

            case "$SCHEDULE" in

              "0 2 * * *")
                echo "run-ingest=true" >> "$GITHUB_OUTPUT"
                echo "run-score=true" >> "$GITHUB_OUTPUT"
                echo "run-digest=false" >> "$GITHUB_OUTPUT"
                echo "digest-freq=none" >> "$GITHUB_OUTPUT"
                ;;

              "0 9 * * 1")
                echo "run-ingest=false" >> "$GITHUB_OUTPUT"
                echo "run-score=false" >> "$GITHUB_OUTPUT"
                echo "run-digest=true" >> "$GITHUB_OUTPUT"
                echo "digest-freq=weekly" >> "$GITHUB_OUTPUT"
                ;;

              *)
                echo "Unknown schedule: $SCHEDULE"

                echo "run-ingest=false" >> "$GITHUB_OUTPUT"
                echo "run-score=false" >> "$GITHUB_OUTPUT"
                echo "run-digest=false" >> "$GITHUB_OUTPUT"
                echo "digest-freq=none" >> "$GITHUB_OUTPUT"
                ;;

            esac
          fi


  # ============================================================
  # INGEST ISSUES
  # ============================================================

  ingest-issues:
    name: Ingest Issues from GitHub
    runs-on: ubuntu-latest

    needs: schedule-check

    if: needs.schedule-check.outputs.run-ingest == 'true'

    timeout-minutes: 10

    # IMPORTANT:
    # These variables are available to EVERY step,
    # including npm ci and its postinstall script.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      GITHUB_INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ingestion worker
        run: npm run ingest

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Ingestion failed at $(date -u)"
          exit 1


  # ============================================================
  # SCORE ISSUES
  # ============================================================

  score-issues:
    name: Score Issues by Solvability
    runs-on: ubuntu-latest

    needs:
      - schedule-check
      - ingest-issues

    # always() is important because ingest-issues can be skipped
    # when running score-only.
    if: |
      always() &&
      needs.schedule-check.result == 'success' &&
      needs.schedule-check.outputs.run-score == 'true' &&
      (
        needs.ingest-issues.result == 'success' ||
        needs.ingest-issues.result == 'skipped'
      )

    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      GITHUB_INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run scoring worker
        run: npm run score

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Scoring failed at $(date -u)"
          exit 1


  # ============================================================
  # SEND DIGEST
  # ============================================================

  send-digest:
    name: Send Digest Emails
    runs-on: ubuntu-latest

    needs: schedule-check

    if: needs.schedule-check.outputs.run-digest == 'true'

    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Send daily digest
        if: |
          needs.schedule-check.outputs.digest-freq == 'daily' ||
          needs.schedule-check.outputs.digest-freq == 'both'
        run: npm run digest:daily

      - name: Send weekly digest
        if: |
          needs.schedule-check.outputs.digest-freq == 'weekly' ||
          needs.schedule-check.outputs.digest-freq == 'both'
        run: npm run digest:weekly

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Digest send failed at $(date -u)"
          exit 1


  # ============================================================
  # FINAL PIPELINE STATUS
  # ============================================================

  notify-success:
    name: Pipeline Completed
    runs-on: ubuntu-latest

    needs:
      - schedule-check
      - ingest-issues
      - score-issues
      - send-digest

    if: always()

    steps:

      - name: Check job statuses
        run: |
          echo "Pipeline run completed at $(date -u)"

          echo "Ingest status: ${{ needs.ingest-issues.result }}"
          echo "Score status:  ${{ needs.score-issues.result }}"
          echo "Digest status: ${{ needs.send-digest.result }}"

          INGEST_RES="${{ needs.ingest-issues.result }}"
          SCORE_RES="${{ needs.score-issues.result }}"
          DIGEST_RES="${{ needs.send-digest.result }}"

          # ----------------------------------------------------
          # Check for failures
          # ----------------------------------------------------

          if [ "$INGEST_RES" = "failure" ] ||
             [ "$SCORE_RES" = "failure" ] ||
             [ "$DIGEST_RES" = "failure" ]; then

            echo "❌ One or more pipeline tasks failed!"
            exit 1
          fi

          # ----------------------------------------------------
          # Check for cancellations
          # ----------------------------------------------------

          if [ "$INGEST_RES" = "cancelled" ] ||
             [ "$SCORE_RES" = "cancelled" ] ||
             [ "$DIGEST_RES" = "cancelled" ]; then

            echo "❌ One or more pipeline tasks were cancelled!"
            exit 1
          fi

          # ----------------------------------------------------
          # Check if absolutely nothing ran
          # ----------------------------------------------------

          if [ "$INGEST_RES" = "skipped" ] &&
             [ "$SCORE_RES" = "skipped" ] &&
             [ "$DIGEST_RES" = "skipped" ]; then

            echo "❌ All worker tasks were skipped! No work was executed."
            exit 1
          fi

          echo "✅ Pipeline executed successfully!"
